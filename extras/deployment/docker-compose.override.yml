# Local development overrides.
#
# Auto-merged by `docker compose up` whenever this file sits next to
# docker-compose.yml — no extra flag needed. What it adds over the base
# (production-shaped) compose file:
#
#   - Bind-mounts the live `qknee/` and `scripts/` source trees into both
#     containers, so an edit on the host is picked up without an image
#     rebuild.
#   - Runs uvicorn with `--reload` (watches `/app/qknee` for changes)
#     instead of the production command.
#   - Streamlit's dev server already file-watches and hot-reloads by
#     default once it can see source changes — the bind mount above is
#     the only thing it needs; `--server.runOnSave` just makes that
#     explicit rather than relying on the default.
#   - Shortens healthcheck intervals so `docker compose up` reflects
#     container readiness faster during iterative dev.
#   - Points MLflow at a local, host-visible SQLite/artifact directory
#     (repo-root `mlflow-data/`) instead of the production named volume,
#     so a developer can poke at run data directly on disk.
#
# All bind-mount paths below are relative to the REPO ROOT (`../../...`),
# not this file's own directory — `docker compose` resolves relative
# volume host paths against the compose file's location, and this file
# lives in `extras/deployment/`, two levels below the repo root that
# `qknee/`, `extras/`, `scripts/`, and `mlflow-data/` actually live in.
#
# Usage:
#   docker compose up --build                 # base + this override (default)
#   docker compose -f docker-compose.yml up    # base only, no dev overrides

services:
  api:
    command:
      - "uvicorn"
      - "extras.api.server:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--reload"
      - "--reload-dir"
      - "/app/qknee"
      - "--reload-dir"
      - "/app/extras"
    volumes:
      - ../../qknee:/app/qknee
      - ../../extras:/app/extras
      - ../../scripts:/app/scripts
    environment:
      - LOG_LEVEL=DEBUG
    healthcheck:
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  ui:
    command:
      - "streamlit"
      - "run"
      - "qknee/ui/dashboard.py"
      - "--server.port=8501"
      - "--server.address=0.0.0.0"
      - "--server.runOnSave=true"
    volumes:
      - ../../qknee:/app/qknee
    healthcheck:
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  mlflow:
    volumes:
      - ../../mlflow-data:/mlflow
