# Q-Knee orchestration: FastAPI backend and an MLflow tracking server.
# The Next.js frontend (`frontend/`) is deployed separately (Vercel) and
# is not part of this compose stack.
#
# `mlflow` runs the official MLflow image: it's a lightweight
# tracking/artifact server with no dependency on this project's
# (multi-GB) ML stack, so building it from our own Dockerfile would just
# waste image-build time and disk for no benefit.
#
# Usage:
#   docker compose up --build       # start both services
#   docker compose up --build api   # start just the backend
#
# The backend is reachable at         http://localhost:8000  (docs at /docs)
# The MLflow tracking UI is reachable at http://localhost:5000
#
# `docker-compose.override.yml` (auto-merged by `docker compose up`, no
# extra flag needed) layers local-development conveniences — live-source
# bind mounts and hot-reload — on top of this file. Run
# `docker compose -f docker-compose.yml up` alone to skip those overrides
# and get this file's production-shaped configuration exactly as written.

services:
  api:
    build:
      # Repo root, not this file's own directory (`docker compose`
      # resolves a relative `context:` against the compose file's
      # location) -- the Dockerfile's `COPY requirements.txt .` /
      # `COPY . .` and the root `.dockerignore` both assume the build
      # context IS the repo root. AUDIT.md P1 #9: found via an actual
      # `docker compose config` validation run, not just a path guess.
      context: ../..
      dockerfile: extras/deployment/Dockerfile
    image: qknee:latest
    container_name: qknee-api
    command: ["uvicorn", "extras.api.server:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      # Lightweight config — no secrets here; anything sensitive (API keys,
      # DB creds) belongs in a git-ignored `.env` file referenced via
      # `env_file:` instead of being inlined below.
      - PYTHONUNBUFFERED=1
      - PCA_ARTIFACT_PATH=/app/qknee/artifacts/pca_scaler.pkl
      - MODEL_CHECKPOINT_PATH=/app/qknee/artifacts/qknee_model.pt
      - DATA_ROOT_PATH=/app/data
      # AUDIT.md P1 #8: extras.api.auth refuses to start without a JWT
      # signing secret by default (no committed fallback exists anymore —
      # see extras/api/.env.example). QKNEE_ENV=development here is what
      # makes the explicit insecure-dev-secret opt-in below available at
      # all; for anything beyond throwaway local Docker use, set a real
      # QKNEE_JWT_SECRET_KEY via a git-ignored `.env` file (env_file:)
      # instead of these two lines.
      - QKNEE_ENV=development
      - QKNEE_ALLOW_INSECURE_JWT_SECRET=1
      # Reachable by any training/eval script that wants to log runs
      # (`mlflow.set_tracking_uri(os.environ["MLFLOW_TRACKING_URI"])`);
      # nothing in the pipeline calls MLflow yet, this just wires the URI
      # through so that's a config change, not a networking one, later.
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      # CPU thread tuning for the PennyLane default.qubit simulator + Torch
      # backend — keep both containers from oversubscribing the host's
      # cores. Override to match the deployment host, e.g. `nproc`.
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - TORCH_NUM_THREADS=4
      # Optional PostgreSQL/Redis backends for extras.api.auth's user
      # repository / extras.api.server's CacheService — left unset (the
      # commented-out lines below) by default, which is fully supported:
      # both modules degrade to a local JSON user store and an in-process
      # TTL cache with no error. Uncomment (and add a `postgres`/`redis`
      # service to this file) to opt into a shared, multi-replica-safe
      # store instead; put real credentials in a git-ignored `.env` file
      # referenced via `env_file:`, never inlined here.
      # - DATABASE_URL=postgresql+asyncpg://qknee:password@postgres:5432/qknee
      # - REDIS_URL=redis://redis:6379/0
    volumes:
      # Model checkpoint storage: the fitted PCA/scaler artifact and any
      # trained QKneeModel checkpoint live on the host (outside the image)
      # so a new model can be dropped in and picked up on container
      # restart, with no image rebuild required.
      - ../../qknee/artifacts:/app/qknee/artifacts:ro
      # Raw MRI training/eval data — read-only, this service never writes
      # back into the dataset itself.
      - ../../data:/app/data:ro
      # Grad-CAM / evaluation figures and generated deck assets written by
      # gradcam.py / evaluate.py / generate_deck_assets.py persist on the
      # host instead of vanishing when the container exits.
      - ../../eval_outputs:/app/eval_outputs
      - ../../deck_assets:/app/deck_assets
      # Host-visible log directory, so operators can tail/ship logs
      # without shelling into the container.
      - ../../logs:/app/logs
    healthcheck:
      # No curl/wget in the slim runtime image (kept out to stay lean) —
      # a one-line Python check against FastAPI's own /health endpoint
      # covers the same purpose without adding a package.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - qknee-net
    deploy:
      resources:
        # Bounds match this service's OMP_NUM_THREADS/MKL_NUM_THREADS/
        # TORCH_NUM_THREADS=4 above — the CPU limit caps what the container
        # can actually use, so the thread-pool tuning above isn't fighting
        # a scheduler quota smaller than what it spins up.
        limits:
          cpus: "4.0"
          memory: 4g
        reservations:
          cpus: "1.0"
          memory: 1g

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    container_name: qknee-mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/db/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      # Named volume (rather than a host bind mount) for the tracking
      # store/artifacts: this data is MLflow-internal state, not something
      # a developer needs to browse/edit directly on the host the way
      # `qknee/artifacts` or `data/` are.
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - qknee-net
    deploy:
      resources:
        # MLflow's tracking server is a thin metadata/artifact-proxy
        # process — no ML workload runs in this container, so it needs
        # far less headroom than `api`/`ui`.
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.25"
          memory: 256m

networks:
  qknee-net:
    driver: bridge

volumes:
  mlflow-data:
