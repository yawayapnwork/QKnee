# Render Blueprint for the Q-Knee FastAPI backend (extras/api/server.py)
services:
  - type: web
    name: qknee-api
    env: python
    plan: free
    region: oregon
    branch: main
    buildCommand: >-
      pip install --upgrade pip &&
      pip install -r requirements.txt -r extras/api/requirements.txt &&
      pip install -e .
    startCommand: python -m uvicorn extras.api.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: QKNEE_ENV
        value: production
      - key: QKNEE_JWT_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: QKNEE_RADIOLOGIST_INVITE_CODE
        sync: false
      - key: REDIS_URL
        sync: false