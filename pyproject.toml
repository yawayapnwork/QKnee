[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qknee"
version = "1.0.0"
description = "Hybrid Quantum Machine Learning Platform for Knee Abnormality Detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Yashika Nayak", email = "yashika@example.com" }
]
keywords = [
    "quantum-machine-learning",
    "pennylane",
    "pytorch",
    "medical-imaging",
    "mri",
    "radiology",
    "grad-cam",
    "fastapi",
    "streamlit"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Lightweight core only — this list is what installs on Vercel (mirrored
# in `requirements-vercel.txt` / `qknee/api/requirements.txt`), where
# `qknee/api/server.py` runs as a thin router/mock/proxy layer, never the
# full ML pipeline. Everything the real ResNet18/PennyLane/Grad-CAM
# pipeline and the Streamlit UI need lives under the `ml` extra below and
# is installed separately for Render/Docker via the full root
# `requirements.txt` (see Dockerfile) — `pip install -e .[ml]` for a local
# dev environment that wants both.
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "PyJWT>=2.8.0",
    "argon2-cffi>=23.1.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Full ML/imaging/UI stack — everything `qknee.models`, `qknee.data`,
# `qknee.xai`, and `qknee.ui` need for real inference. This is what turns
# a lightweight router into the full diagnostic pipeline (Render/Docker
# only; deliberately excluded from Vercel's function bundle, which is
# capped at 500MB and where torch/torchvision/pennylane/SimpleITK/nibabel
# alone would blow well past that).
ml = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "pennylane>=0.35.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "SimpleITK>=2.3.0",
    "pydicom>=2.4.0",
    "nibabel>=5.1.0",
    "opencv-python-headless>=4.8.0",
    "Pillow>=10.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "reportlab>=4.0.0",
    "streamlit>=1.30.0",
    "joblib>=1.3.0",
    "SQLAlchemy>=2.0.25",
    "redis>=5.0.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
]

[project.scripts]
qknee-train = "scripts.train:main"
qknee-server = "qknee.api.server:main"
qknee-verify = "scripts.verify_deployment:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["qknee*"]

[tool.setuptools.package-data]
qknee = ["artifacts/**/*", "config/*.yaml"]

[tool.vercel]
entrypoint = "qknee.api.server:app"

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["qknee/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.tox
  | build
  | dist
  | qknee/artifacts
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "qknee/artifacts",
    "eval_outputs"
]