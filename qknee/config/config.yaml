# Q-Knee central configuration.
#
# Loaded via qknee.config.loader.load_config(). Any key here can be
# overridden at runtime by an environment variable of the same name in
# UPPER_SNAKE_CASE (e.g. `paths.pca_artifact` -> $PCA_ARTIFACT_PATH), which
# is how the Docker deployment (see docker-compose.yml) points the API/UI
# containers at a bind-mounted checkpoint without rebuilding the image.

paths:
  data_root: "data"                                  # env: DATA_ROOT_PATH — expects data/{train,val,test}/<class>/*
  pca_artifact: "qknee/artifacts/pca_scaler.pkl"     # env: PCA_ARTIFACT_PATH
  model_checkpoint: "qknee/artifacts/qknee_model.pt" # env: MODEL_CHECKPOINT_PATH
  acl_checkpoint: "qknee/artifacts/acl_vqc.pt"           # env: ACL_CHECKPOINT_PATH — condition-specific VQC head
  meniscus_checkpoint: "qknee/artifacts/meniscus_vqc.pt" # env: MENISCUS_CHECKPOINT_PATH — condition-specific VQC head
  eval_output_dir: "eval_outputs"
  deck_output_dir: "deck_assets"
  checkpoint_dir: "qknee/artifacts/checkpoints"  # periodic + best-model checkpoints from scripts/train.py

data:
  image_size: [224, 224]
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]
  image_extensions: [".png", ".jpg", ".jpeg"]
  volume_extensions: [".npy"]
  batch_size: 32
  num_workers: 4
  train_augmentation:
    random_rotation_degrees: 10
    horizontal_flip_prob: 0.5
    gaussian_noise_std: 0.02

resnet:
  feature_dim: 512
  freeze_backbone: true
  backend_engine: "pytorch"      # "pytorch" (eager ResNet18FeatureExtractor) or "onnx" (ONNXFeatureExtractor)
  onnx_path: "qknee/artifacts/resnet18_extractor.onnx"  # used only when backend_engine == "onnx"; see scripts/export_onnx.py

pca:
  n_components: 4
  use_incremental_pca: false
  angle_range: [0.0, 6.283185307179586]  # [0, 2*pi], radians

quantum:
  n_qubits: 4
  n_layers: 3
  device: "default.qubit"
  diff_method: "backprop"

training:
  learning_rate: 0.01
  n_epochs: 30
  log_every: 5
  optimizer: "adam"
  val_holdout_fraction: 0.2    # used to carve a validation split out of train/ when no val/ directory exists
  pca_fit_max_samples: 2000    # cap on ResNet embeddings collected to fit QuantumDimReducer
  max_train_samples: null      # null = use the full training split for the full-batch VQC training step
  early_stopping_patience: 10       # epochs without validation-loss improvement before scripts/train.py stops early
  early_stopping_min_delta: 0.0001  # minimum validation-loss decrease counted as an "improvement"

gradcam:
  alpha: 0.45
  colormap: "COLORMAP_JET"

evaluation:
  synthetic_n_samples: 800   # size of the synthetic dataset used by evaluate.py / generate_deck_assets.py
  test_size: 0.25            # train/test split fraction held out for evaluation
  random_seed: 0             # seed for synthetic data generation, model init, and train/test split
  classical_max_iter: 2000   # max_iter for the sklearn LogisticRegression baseline
  figure_dpi: 150            # dpi for evaluate.py's saved confusion-matrix/ROC figures
  deck_figure_dpi: 200       # dpi for generate_deck_assets.py's saved figures

api:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:8501"
    - "http://127.0.0.1:8501"
  tear_risk_threshold: 0.5

device: null  # null -> auto-detect ("cuda" if available, else "cpu")

logging:
  level: "INFO"
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"
